sources:
  - id: "corruptioncounter-2025-trump-profiteering-tracker"
    type: "REPORT"
    title: "Trump's Presidential Profiteering: A Real-Time Corruption Tracker"
    author:
      - "CorruptionCounter"
    year: 2025
    url: "https://corruptioncounter.com/"
    accessed: "2026-03-03"
    status: "analyzed"
    analysis_file: "analysis/sources/corruptioncounter-2025-trump-profiteering-tracker.md"
    reliability: 0.40
    bias_notes: >-
      Advocacy-style corruption tracker with strong rhetoric. Useful for enumerating alleged cases and source links, but
      topline dollar aggregation is unclear and appears internally inconsistent with the embedded dataset captured.
    topics:
      - corruption
      - profiteering
      - trump
      - pardons
      - foreign-influence
      - tracking
    domains:
      - GOV
      - ECON
    claims_extracted:
      - GOV-2026-196
      - GOV-2026-197
      - GOV-2026-198
      - GOV-2026-199
      - GOV-2026-200
      - GOV-2026-201
