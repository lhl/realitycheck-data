  - id: "zitron-2026-ai-industry-lying"
    type: "BLOG"
    title: "The AI Industry Is Lying To You"
    author: "Ed Zitron"
    year: 2026
    url: "https://www.wheresyoured.at/the-ai-industry-is-lying-to-you/"
    accessed: "2026-03-28"
    status: "analyzed"
    analysis_file: "analysis/sources/zitron-2026-ai-industry-lying.md"
    reliability: 0.55
    bias_notes: >-
      Integrates credible third-party datapoints (CBRE, Sightline) with sharper claims of deception and a broad
      “rot” narrative tying together debt, infrastructure, and internal AI incidents. Strong rhetorical tone and
      some quant totals that depend on definitions (pipeline stages; debt deal scope). Treat as an adversarial
      synthesis and normalize terms carefully.
    topics:
      - datacenters
      - power
      - pipeline
      - debt
      - coreweave
      - hyperscalers
      - tokenmaxxing
      - outages
      - security-incidents
      - ai-bubble
    domains:
      - RESOURCE
      - ECON
      - INST
      - RISK
      - SOC
    claims_extracted:
