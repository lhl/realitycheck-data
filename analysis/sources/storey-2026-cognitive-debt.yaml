sources:
  - id: "storey-2026-cognitive-debt"
    type: "BLOG"
    title: "How Generative and Agentic AI Shift Concern from Technical Debt to Cognitive Debt"
    author:
      - "Margaret-Anne Storey"
    year: 2026
    url: "https://margaretstorey.com/blog/2026/02/09/cognitive-debt/"
    accessed: "2026-02-16"
    status: "analyzed"
    analysis_file: "analysis/sources/storey-2026-cognitive-debt.md"
    reliability: 0.60
    bias_notes: >-
      Short conceptual blog post by a software-engineering researcher arguing for a reframing (“technical debt”
      → “cognitive debt”) under generative/agentic AI. Strong on mechanism plausibility + grounded SE lineage
      (Naur/Brooks) + concrete mitigations; weak on empirical measurement and on disambiguating “cognitive
      debt” (software shared-theory vs general LLM “cognitive offloading” usage).
    topics:
      - cognitive-debt
      - technical-debt
      - software-engineering
      - agentic-ai
      - code-comprehension
      - knowledge-management
    domains:
      - META
      - TECH
