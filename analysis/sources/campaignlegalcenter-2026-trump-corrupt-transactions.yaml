sources:
  - id: "campaignlegalcenter-2026-trump-corrupt-transactions"
    type: "REPORT"
    title: "Trump’s Corrupt Transactions: How the 47th President Has Brazenly Traded Official Benefits for Personal and Political Gain"
    author:
      - "Campaign Legal Center"
    year: 2026
    url: "https://campaignlegal.org/sites/default/files/2026-02/Trump_Transaction_Tracker_February_2026.pdf"
    accessed: "2026-03-03"
    status: "analyzed"
    analysis_file: "analysis/sources/campaignlegalcenter-2026-trump-corrupt-transactions.md"
    reliability: 0.55
    bias_notes: >-
      Anti-corruption advocacy report. Strongest as a structured catalog of alleged “transactions” with citations; broad
      historical and causal claims require careful audit of entries and standards for linking benefits to actions.
