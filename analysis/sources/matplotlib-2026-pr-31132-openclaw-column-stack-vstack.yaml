      Matplotlib PR #31132 was opened by `crabby-rathbun` on 2026-02-10 to
      address issue #31130 with a `np.column_stack`→`np.vstack().T` performance
      change, and it was closed by `scottshambaugh` on 2026-02-11 citing that the
      account self-identifies as an OpenClaw AI agent and that the issue is
      intended for human contributors.
    type: "[F]"
    domain: "INST"
    evidence_level: "E2"
    credence: 0.95
