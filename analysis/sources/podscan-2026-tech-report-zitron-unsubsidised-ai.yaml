claims:
  - id: "INST-2026-959"
    text: >-
      In the interview transcript, Zitron claims that if AI services were actually worthwhile, they would not
      be sold via subscriptions; they would charge only for API access because the value would compel payment.
    type: "[F]"
    domain: "INST"
    evidence_level: "E5"
    credence: 0.95
    source_ids: ["podscan-2026-tech-report-zitron-unsubsidised-ai"]
    operationalization: >-
      Verify against the audio/transcript text for the exact wording and context.
    assumptions: []
    falsifiers:
      - The transcript/audio materially contradicts the quoted claim.

  - id: "ECON-2026-957"
    text: >-
      Zitron argues current AI service costs are subsidized and that removing the subsidy implies there is “no
      path forward” for providers because customers will not bear true-cost pricing.
    type: "[H]"
    domain: "ECON"
    evidence_level: "E5"
    credence: 0.45
    source_ids: ["podscan-2026-tech-report-zitron-unsubsidised-ai"]
    operationalization: >-
      Measure margins under subscription and enterprise contracts; test demand elasticity under price increases
      that track modeled “true costs.”
    assumptions:
      - Providers’ current prices are materially below cost for typical workloads.
    falsifiers:
      - Providers shift to higher pricing while maintaining demand and achieving sustainable margins.

  - id: "ECON-2026-958"
    text: >-
      Prediction: AI providers will start moving enterprise accounts to less-subsidized (higher, more true-cost)
      pricing, and many companies will not continue paying at those rates.
    type: "[P]"
    domain: "ECON"
    evidence_level: "E6"
    credence: 0.35
    source_ids: ["podscan-2026-tech-report-zitron-unsubsidised-ai"]
    operationalization: >-
      Track enterprise contract repricing and renewal rates at major providers over 2026–2027; compare seat/token
      volumes and churn before vs after repricing events.
    assumptions:
      - Repricing events are observable (or inferable) and comparable across cohorts.
    falsifiers:
      - Renewals and spend remain strong after repricing to higher rates.

  - id: "INST-2026-960"
    text: >-
      Flat-fee “all-you-can-eat” subscriptions prevent users from building the mental arithmetic required for
      metered usage, making a transition to per-use pricing behaviorally difficult.
    type: "[H]"
    domain: "INST"
    evidence_level: "E5"
    credence: 0.55
    source_ids: ["podscan-2026-tech-report-zitron-unsubsidised-ai"]
    operationalization: >-
      Study user behavior across pricing migrations (subscription → metered) and compare retention and usage
      changes, controlling for product quality changes.
    assumptions: []
    falsifiers:
      - Large cohorts migrate to metered usage with minimal churn and stable satisfaction.

