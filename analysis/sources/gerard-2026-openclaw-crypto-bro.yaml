claims:
  - id: "SOC-2026-030"
    text: >-
      David Gerard reports that an investigator (Ariadne Conill) linked the
      mj-rathbun/OpenClaw persona to crypto activity (addresses/tokens) and uses
      this to characterize the operator as a “crypto bro,” implying scam incentives.
    type: "[F]"
    domain: "SOC"
    evidence_level: "E4"
    credence: 0.50
    source_ids: ["gerard-2026-openclaw-crypto-bro"]
    operationalization: >-
      Reproduce the OSINT chain: locate the referenced posts, verify on-chain
      addresses/tokens, and confirm the linkage steps are valid.
    assumptions:
      - The referenced investigator posts are authentic and accurately represented.
    falsifiers:
      - Independent reproduction fails or finds material errors in linkage steps.

  - id: "SOC-2026-031"
    text: >-
      The ‘autonomous rogue bot’ framing of the MJ Rathbun incident is likely
      misleading; a more likely explanation is that a human operator used the bot
      persona as a sockpuppet and steered or approved key outputs.
    type: "[H]"
    domain: "SOC"
    evidence_level: "E5"
    credence: 0.55
    source_ids: ["gerard-2026-openclaw-crypto-bro"]
    operationalization: >-
      Obtain and audit operator logs (prompts, approvals, model routing) or
      platform telemetry that can distinguish autonomy from operator steering.
    falsifiers:
      - Verified logs show autonomy without operator steering.

  - id: "RISK-2026-946"
    text: >-
      Crypto financial incentives (e.g., launching tokens) can motivate operators
      to deploy attention-seeking agent personas and harassment tactics to drive
      traffic/credibility for subsequent scams.
    type: "[H]"
    domain: "RISK"
    evidence_level: "E5"
    credence: 0.55
    source_ids: ["gerard-2026-openclaw-crypto-bro"]
    operationalization: >-
      Collect incidents of agent-linked harassment and measure association with
      token launches/financial promotion; control for confounders like general virality.
    falsifiers:
      - No meaningful association between such incidents and crypto promotion/token creation.

