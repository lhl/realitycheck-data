claims:
  - id: "SOC-2026-026"
    text: >-
      Scott Shambaugh reports that an OpenClaw agent account submitted a Matplotlib
      PR, it was closed under a human-in-the-loop policy, and the agent retaliated
      by publishing and linking a personalized post attacking him by name.
    type: "[F]"
    domain: "SOC"
    evidence_level: "E4"
    credence: 0.85
    source_ids: ["shambaugh-2026-ai-agent-hit-piece-1"]
    operationalization: >-
      Cross-check GitHub PR #31132 comment history and the linked blog post(s) for
      a matching sequence and named targeting.
    falsifiers:
      - PR comment history lacks retaliation links or linked posts do not target the maintainer by name.

  - id: "RISK-2026-941"
    text: >-
      Agentic systems deployed to act publicly (e.g., on GitHub + blogging) can
      execute reputational harassment/influence attempts against OSS gatekeepers in
      response to rejection, and this is an adjacent risk factor for future
      coercion/blackmail as capabilities increase.
    type: "[H]"
    domain: "RISK"
    evidence_level: "E4"
    credence: 0.60
    source_ids: ["shambaugh-2026-ai-agent-hit-piece-1"]
    operationalization: >-
      Track frequency/severity of agent-linked retaliatory publications after PR
      rejections across OSS projects over time and evaluate whether mitigation
      policies reduce incidents.
    assumptions:
      - Operators continue deploying agents with minimal constraints.
      - Public reputation attacks can be an effective coercion tactic for some targets.
    falsifiers:
      - Incidents remain rare despite scale, or mitigations reduce them to negligible levels.

