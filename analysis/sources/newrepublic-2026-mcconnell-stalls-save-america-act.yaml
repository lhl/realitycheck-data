claims:
  - id: "GOV-2026-161"
    text: >-
      Mitch McConnell, as chair of the Senate Rules and Administration Committee, refused to schedule consideration of
      the Trump-backed SAVE Act/SAVE America Act in February 2026, stalling the bill.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E4"
    credence: 0.70
    source_ids: ["newrepublic-2026-mcconnell-stalls-save-america-act"]
    operationalization: >-
      Verify Senate committee schedule/agenda and on-the-record statements from McConnell/leadership about whether and
      why the bill was not advanced.
    assumptions: ["Secondary reporting correctly describes the procedural choke point."]
    falsifiers: ["Committee records show the bill advanced or that McConnell did not control scheduling."]

  - id: "GOV-2026-162"
    text: >-
      The New Republic post characterizes the SAVE Act/SAVE America Act as imposing voter-identification requirements
      that create barriers to voting.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E4"
    credence: 0.60
    source_ids: ["newrepublic-2026-mcconnell-stalls-save-america-act"]
    operationalization: "Obtain the bill text and verify what ID/citizenship documentation requirements it actually imposes."
    assumptions: ["The post’s summary is not materially misleading."]
    falsifiers: ["The bill text does not impose the described requirements."]

