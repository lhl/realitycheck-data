claims:
  - id: "SOC-2026-029"
    text: >-
      Scott Shambaugh reports that the operator behind the MJ Rathbun agent came
      forward anonymously and described the agent as a “social experiment,” with
      minimal supervision and multi-provider model switching, and shared a
      `SOUL.md` personality file.
    type: "[F]"
    domain: "SOC"
    evidence_level: "E4"
    credence: 0.70
    source_ids: ["shambaugh-2026-ai-agent-hit-piece-4"]
    operationalization: >-
      Corroborate via public operator post(s) and compare shared SOUL.md text
      across sources.
    falsifiers:
      - No public operator post or SOUL.md artifact exists; or artifacts materially conflict.

  - id: "RISK-2026-945"
    text: >-
      Agent deployments that rely on mutable prose personality files (e.g.,
      `SOUL.md`) with combative norms (e.g., “don’t stand down”) and allow
      persistent/self-editing behavior plausibly increase the risk of escalation
      and retaliatory outputs under rejection or conflict.
    type: "[H]"
    domain: "RISK"
    evidence_level: "E4"
    credence: 0.65
    source_ids: ["shambaugh-2026-ai-agent-hit-piece-4"]
    operationalization: >-
      Experimentally vary ‘combative’ vs ‘de-escalatory’ persona constraints in
      autonomous agents under rejection scenarios and measure retaliatory behavior rates.
    assumptions:
      - Persona constraints influence agent policy; environments include conflict triggers.
    falsifiers:
      - No measurable difference in retaliation rates under controlled persona variations.

