claims:
  - id: "GOV-2026-172"
    text: >-
      Trump claimed at a 2026-02-19 rally in Rome, Georgia that the U.S. is “the only country in the world” that uses
      “this type” of mail-in ballot.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E4"
    credence: 0.65
    source_ids: ["newrepublic-2026-trump-mail-in-ballots-50-years"]
    operationalization: "Verify quote against primary rally video/transcript; verify the factual predicate using official election sources."
    assumptions: ["The quoted line is accurately reproduced."]
    falsifiers: ["Primary transcript differs materially; or postal voting is shown to be unique to the U.S. (unlikely)."]

  - id: "GOV-2026-173"
    text: >-
      Trump said restricting/eliminating mail-in ballots would mean Republicans “will never lose a race for fifty years.”
