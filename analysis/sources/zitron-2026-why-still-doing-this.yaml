    reliability: 0.55
    bias_notes: >-
      Strongly anti-hype critique focused on pricing mental models and subscription-unit-economics fragility.
      Mixes auditable provider documentation (Claude Code cost guidance) with derived estimates and extreme
      examples. Treat illustrative numerics as hypotheses unless traced to primary disclosures.
    topics:
      - ai
      - subscriptions
      - metered-pricing
      - token-burn
      - claude
      - claude-code
      - anthropic
      - openai
      - unit-economics
    domains:
      - ECON
      - INST
      - LABOR
    claims_extracted:
      - INST-2026-958
      - ECON-2026-952
