sources:
  - id: "zitron-2024-subprime-ai-crisis"
    type: "BLOG"
    title: "The Subprime AI Crisis"
    author: "Ed Zitron"
    year: 2024
    url: "https://www.wheresyoured.at/subprimeai/"
    accessed: "2026-03-28"
    status: "analyzed"
    analysis_file: "analysis/sources/zitron-2024-subprime-ai-crisis.md"
    reliability: 0.60
    bias_notes: >-
      Independent tech critic with a strong anti-bubble, anti-hype orientation. Mixes reported deal terms and
      fundraising facts with speculative, rhetorically forceful predictions about industry-wide collapse.
      Tends to emphasize fragility and downplay cost-decline trajectories, pricing segmentation, and enterprise
      usage-based economics.
    topics:
      - ai
      - llms
      - openai
      - microsoft
      - venture-capital
      - pricing
      - unit-economics
      - bubble
      - debt
    domains:
      - ECON
      - TRANS
      - INST
    claims_extracted:
      - ECON-2026-935
