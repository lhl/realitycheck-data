claims:
  - id: "SOC-2026-049"
    text: >-
      Ars Technica published "AI can rewrite open source code—but can it rewrite the
      license, too?" on 2026-03-10 with Kyle Orland as author.
    type: "[F]"
    domain: "SOC"
    evidence_level: "E2"
    credence: 0.99
    source_ids: ["arstechnica-2026-ai-rewrite-open-source-license"]
    operationalization: "Verify page schema/byline/published metadata."
    falsifiers:
      - "Page metadata does not match title/date/author."

  - id: "INST-2026-969"
    text: >-
      The article reports chardet 7.0.0 as a ground-up MIT rewrite and drop-in
      replacement with major speed/accuracy claims.
    type: "[F]"
    domain: "INST"
    evidence_level: "E4"
    credence: 0.82
    source_ids: ["arstechnica-2026-ai-rewrite-open-source-license"]
    operationalization: "Compare article text against chardet 7.0.0 release notes."
    falsifiers:
      - "Release notes lack the reported framing/claims."

  - id: "INST-2026-970"
    text: >-
      The article reports Mark Pilgrim's objection that the chardet rewrite is not
      clean-room due to prior exposure and therefore should remain under LGPL terms.
    type: "[F]"
    domain: "INST"
    evidence_level: "E4"
    credence: 0.84
    source_ids: ["arstechnica-2026-ai-rewrite-open-source-license"]
    operationalization: "Compare reported objection against issue #327 body text."
    falsifiers:
      - "Issue #327 does not contain the reported objection substance."

  - id: "GOV-2026-267"
    text: >-
      The article reports Blanchard's rebuttal including acknowledged prior exposure,
      structural independence claims, and a JPlag similarity argument (including a
      1.29% max similarity figure vs 6.0.0 in his table).
    type: "[F]"
    domain: "GOV"
    evidence_level: "E4"
    credence: 0.80
    source_ids: ["arstechnica-2026-ai-rewrite-open-source-license"]
    operationalization: >-
      Compare article text to issue #327 maintainer response comment and linked artifacts.
    falsifiers:
      - "Maintainer response lacks the reported exposure/JPlag core claims."

  - id: "GOV-2026-268"
    text: >-
      Legal status of AI-generated software licensing remains unsettled, including
      unresolved derivative/taint questions for model-assisted rewrites.
    type: "[H]"
    domain: "GOV"
    evidence_level: "E4"
    credence: 0.72
    source_ids: ["arstechnica-2026-ai-rewrite-open-source-license"]
    operationalization: >-
      Track software-specific case law and regulatory guidance that directly addresses
      AI-generated code authorship/licensing/derivative status.
    falsifiers:
      - "Controlling precedent clearly resolves these software-specific questions."

  - id: "RISK-2026-979"
    text: >-
      If AI-assisted rewrites become cheap and common, OSS licensing strategy and
      software-economics dynamics may shift materially in the near term.
    type: "[P]"
    domain: "RISK"
    evidence_level: "E5"
    credence: 0.55
    source_ids: ["arstechnica-2026-ai-rewrite-open-source-license"]
    operationalization: >-
      Monitor rate of high-profile AI rewrite/relicense episodes and adoption/policy
      changes across major OSS ecosystems over 1-3 years.
    assumptions:
      - "Rewrite cost reduction outpaces growth in legal/governance countermeasures."
    falsifiers:
      - "Empirical tracking shows low incidence and limited policy/economic impact."
