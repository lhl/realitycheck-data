sources:
  - id: "chardet-2026-issue-327-no-right-to-relicense"
    type: "CONVO"
    title: "No right to relicense this project (chardet/chardet issue #327)"
    author: "a2mark (issue opener) + repository maintainers/commenters"
    year: 2026
    url: "https://github.com/chardet/chardet/issues/327"
    accessed: "2026-04-01"
    status: "analyzed"
    analysis_file: "analysis/sources/chardet-2026-issue-327-no-right-to-relicense.md"
    reliability: 0.88
    bias_notes: >-
      Primary GitHub issue artifacts are high-fidelity for timeline and posted statements,
      but legal conclusions in-thread are adversarial/opinionated and not adjudicated.
    topics:
      - chardet
      - open-source licensing
      - LGPL
      - MIT
      - AI-assisted rewrite
      - clean room
      - derivative work
    domains:
      - INST
      - GOV
      - RISK
    claims_extracted:
      - INST-2026-966
      - INST-2026-967
      - INST-2026-968
