claims:
  - id: "GOV-2026-236"
    text: >-
      In Trump v. United States (2024), the U.S. Supreme Court held that a former President has absolute immunity
      from criminal prosecution for actions within his conclusive and preclusive constitutional authority, is entitled
      to at least presumptive immunity for official acts, and has no immunity for unofficial acts.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E2"
    credence: 0.95
    source_ids: ["supremecourt-2024-trump-v-united-states-opinion"]
    operationalization: "Verify in the syllabus/holding language; track remand outcomes and any later limiting/superseding rulings."
    assumptions: []
    falsifiers: ["Official opinion lacks the stated framework."]

  - id: "GOV-2026-237"
    text: >-
      The Trump v. United States syllabus states that in dividing official from unofficial conduct, courts may not
      inquire into the President’s motives and may not deem an action unofficial merely because it allegedly violates
      generally applicable law.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E2"
    credence: 0.90
    source_ids: ["supremecourt-2024-trump-v-united-states-opinion"]
    operationalization: "Verify in the syllabus section providing guidance on distinguishing official vs unofficial conduct."
    assumptions: []
    falsifiers: ["Syllabus does not include these constraints."]

