  - id: "SOC-2026-047"
    text: >-
      The post characterizes the chardet rewrite as API-and-test-suite-driven and
      motivated by moving from LGPL to MIT licensing.
    type: "[F]"
    domain: "SOC"
    evidence_level: "E4"
    credence: 0.78
    source_ids: ["ronacher-2026-ai-and-the-ship-of-theseus"]
