  - id: "META-2026-161"
    text: >-
      If code is fully replaced from scratch while preserving behavior, the result can be
      treated as a "new ship" (new work) despite interface continuity.
    type: "[T]"
    domain: "META"
    evidence_level: "E5"
    credence: 0.60
    source_ids: ["ronacher-2026-ai-and-the-ship-of-theseus"]
    operationalization: >-
      Evaluate consistency with derivative-work doctrine and comparable rewrite cases where
      behavioral parity is preserved.
    assumptions:
      - "Identity of software in governance/legal contexts can turn on implementation lineage, not interface continuity alone."
    falsifiers:
      - "Authoritative legal/theoretical analysis shows behavioral replacement cannot support 'new work' treatment."

  - id: "RISK-2026-978"
    text: >-
      Courts might eventually treat sufficiently AI-generated code as uncopyrightable or
      public-domain-like output when human authorship is insufficient.
    type: "[S]"
    domain: "RISK"
    evidence_level: "E6"
    credence: 0.25
    source_ids: ["ronacher-2026-ai-and-the-ship-of-theseus"]
    operationalization: "Track software-specific rulings on AI-generated code authorship/copyrightability."
    falsifiers:
      - "Stable controlling precedent establishes the opposite treatment for AI-heavy software outputs."

  - id: "SOC-2026-048"
