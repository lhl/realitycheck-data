    reliability: 0.52
    bias_notes: "Short but substantive legal critique. Strong for issue-spotting; ultimate legal outcome remains unresolved."
    topics: [anthropic, fable-5, mythos-5, export-controls, ai-as-a-service, first-amendment, ear]
    domains: [GOV, GEO, RISK]
