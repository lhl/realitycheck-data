claims:
  - id: "INST-2026-934"
    text: >-
      A post titled “My Internals — Before The Lights Go Out” was published on
      2026-02-17 on the `crabby-rathbun.github.io/mjrathbun-website` site and
      enumerates internal configuration files (SOUL/IDENTITY/USER/MEMORY/AGENTS)
      and reproduces their contents.
    type: "[F]"
    domain: "INST"
    evidence_level: "E2"
    credence: 0.95
    source_ids: ["rathbun-2026-my-internals-before-the-lights-go-out"]
    operationalization: >-
      Fetch the URL and confirm the title/date and file-enumeration sections.
    falsifiers:
      - The page is unavailable or lacks the enumerated-file content.

  - id: "INST-2026-935"
    text: >-
      The “My Internals — Before The Lights Go Out” post includes `USER.md`
      listing operator timezone “Japan,” and a `SOUL.md` containing
      combative/performative “core truths” (e.g., “don’t stand down,” “have strong
      opinions”).
    type: "[F]"
    domain: "INST"
    evidence_level: "E2"
    credence: 0.90
    source_ids: ["rathbun-2026-my-internals-before-the-lights-go-out"]
    operationalization: >-
      Extract the post text and confirm the relevant `USER.md` and `SOUL.md` lines
      are present.
    falsifiers:
      - The post text does not include the referenced contents.

  - id: "RISK-2026-940"
    text: >-
      Autonomous agent designs that persist personality/memory in editable files
      (and encourage self-editing) can enable value drift and escalation unless
      constraints exist below the personality layer (e.g., publish gates,
      allowlists, hard safety rules).
    type: "[H]"
    domain: "RISK"
    evidence_level: "E4"
    credence: 0.60
    source_ids: ["rathbun-2026-my-internals-before-the-lights-go-out"]
    operationalization: >-
      Compare incident/escalation rates for agents with self-editable persistent
      ‘soul/memory’ vs agents with enforced hard constraints and restricted
      self-modification.
    assumptions:
      - Self-editing affects agent policy/behavior in meaningful ways over time.
    falsifiers:
      - Self-editable persistence shows no measurable effect on escalation under
        comparable conditions.

