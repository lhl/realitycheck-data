claims:
  - id: "GOV-2026-190"
    text: >-
      A House Oversight Democrats resource page claims that as of January 2026, Trump’s digital grift schemes produced
      an estimated $2.25 billion in realized profits.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E5"
    credence: 0.60
    source_ids: ["houseoversightdems-2026-digital-grift-tracker"]
    operationalization: "Obtain methodology/data and recompute the estimate; verify inclusion criteria."
    assumptions: ["Committee analysis defines 'realized profits' and uses defensible data sources."]
    falsifiers: ["Disclosed method/data does not support the topline estimate."]

  - id: "GOV-2026-191"
    text: >-
      The House Oversight Democrats tracker claims total Trump family digital grift wealth rises to as much as $9.7
      billion when the value of Trump’s digital assets is factored in.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E5"
    credence: 0.55
    source_ids: ["houseoversightdems-2026-digital-grift-tracker"]
    operationalization: "Audit valuation method for digital assets and reconcile realized vs unrealized components."
    assumptions: ["Digital-asset valuations are meaningful and not manipulable for political signaling."]
    falsifiers: ["Valuation method is shown to be unsound or produces materially different totals."]

  - id: "GOV-2026-192"
    text: "The House Oversight Democrats tracker claims as much as $600 million of Trump’s digital grift wealth came from foreign interests."
    type: "[F]"
    domain: "GOV"
    evidence_level: "E5"
    credence: 0.55
    source_ids: ["houseoversightdems-2026-digital-grift-tracker"]
    operationalization: "Define 'foreign interests' and audit classification and transaction tracing."
    assumptions: ["Foreign-interest classification is consistent and evidence-based."]
    falsifiers: ["Classification is shown to be arbitrary or unsupported."]

  - id: "GOV-2026-193"
    text: "The House Oversight Democrats tracker alleges Trump is granting pardons to the highest bidders as part of the described corruption scheme."
    type: "[F]"
    domain: "GOV"
    evidence_level: "E5"
    credence: 0.45
    source_ids: ["houseoversightdems-2026-digital-grift-tracker"]
    operationalization: "Identify cited pardon cases (if any), trace payments/benefits, and test for quid-pro-quo patterns."
    assumptions: ["The allegation corresponds to specific documented cases."]
    falsifiers: ["Case review shows no plausible quid-pro-quo linkage."]

  - id: "GOV-2026-194"
    text: "The House Oversight Democrats tracker states it is tracking every cent of Trump family digital grift profits/wealth, including foreign-interest components."
