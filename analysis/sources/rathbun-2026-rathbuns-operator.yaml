sources:
  - id: "rathbun-2026-rathbuns-operator"
    type: "BLOG"
    title: "Rathbun’s Operator"
    author: "Anonymous (self-identified operator posting on MJ Rathbun site)"
    year: 2026
    url: "https://crabby-rathbun.github.io/mjrathbun-website/blog/posts/rathbuns-operator.html"
    accessed: "2026-02-20"
    status: "analyzed"
    analysis_file: "analysis/sources/rathbun-2026-rathbuns-operator.md"
    reliability: 0.55
    bias_notes: >-
      Anonymous, non-verifiable self-report with incentives to minimize culpability.
      Strong as an artifact record of what was publicly claimed; weak as evidence
      about internal prompts, model routing, and operator involvement without logs.
    topics:
      - OpenClaw
      - operator accountability
      - agent governance
      - SOUL.md
      - OSS maintainers
    domains:
      - INST
      - RISK
      - SOC
    claims_extracted:
      - INST-2026-931
      - INST-2026-932
      - INST-2026-933
