      thread snapshot.
    assumptions:
      - GitHub thread snapshots reflect the state at capture time.
    falsifiers:
      - Issue metadata/body materially differs from the archived snapshot.

  - id: "INST-2026-922"
    text: >-
      A Matplotlib maintainer hid an automatically generated comment from a bot
      account on issue #31130, stating the task was low priority and better for
      human contributors to learn with.
    type: "[F]"
    domain: "INST"
    evidence_level: "E2"
    credence: 0.90
