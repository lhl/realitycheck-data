claims:
  - id: "GOV-2026-125"
    text: >-
      Politico reports that Defense Secretary Pete Hegseth gave Anthropic an ultimatum to provide unfettered
      access to Claude by a Friday-evening deadline, threatening supply-chain-risk designation and Defense
      Production Act compulsion if it did not comply.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E4"
    credence: 0.80
    source_ids: ["politico-2026-hegseth-anthropic-ultimatum"]
    operationalization: "Cross-check ultimatum terms across multiple outlets and official statements; identify whether any formal DPA order or supply-chain-risk determination was issued."
    assumptions: []
    falsifiers:
      - "Credible reporting or official documents contradict the ultimatum terms."

  - id: "GOV-2026-126"
    text: >-
      Politico reports that lawyers and AI policymakers argue DoW’s strategy is contradictory and could chill
      partnerships because it simultaneously threatens to label Anthropic a supply-chain risk while also
      threatening to compel its cooperation under the DPA.
    type: "[T]"
    domain: "GOV"
    evidence_level: "E5"
    credence: 0.65
    source_ids: ["politico-2026-hegseth-anthropic-ultimatum"]
    operationalization: "Track actual partnership outcomes and vendor participation in DoW AI programs after the ultimatum; test whether similar coercive bargaining leads to reduced cooperation."
    assumptions:
      - "Private-sector partnership willingness is sensitive to perceived coercion and reputational risk."
    falsifiers:
      - "Observed partnerships and participation remain stable or increase despite the ultimatum."

  - id: "GOV-2026-127"
    text: >-
      Politico reports the standoff has roots in the January Maduro capture operation where Claude was reportedly
      used (per WSJ) and in Anthropic’s follow-up questions to Palantir.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E4"
    credence: 0.65
    source_ids: ["politico-2026-hegseth-anthropic-ultimatum"]
    operationalization: "Locate WSJ reporting and confirm the operational use and inquiry chain; reconstruct timeline to test causal role."
    assumptions: []
    falsifiers:
      - "Evidence contradicts Claude’s role or the inquiry chain."

  - id: "GOV-2026-128"
    text: "DoW spokesperson Sean Parnell confirmed to Politico that the Department’s relationship with Anthropic is being reviewed."
    type: "[F]"
    domain: "GOV"
    evidence_level: "E4"
    credence: 0.80
    source_ids: ["politico-2026-hegseth-anthropic-ultimatum"]
    operationalization: "Confirm statement consistency across outlets and any official DoW releases."
    assumptions: []
    falsifiers:
      - "No such statement exists or the quote is materially inaccurate."

  - id: "GOV-2026-129"
    text: >-
      Politico reports that Senators Elizabeth Warren and Andy Kim criticized the threatened use of the Defense
      Production Act in the Anthropic dispute and warned it could shatter bipartisan consensus supporting the
      statute.
    type: "[F]"
    domain: "GOV"
    evidence_level: "E4"
    credence: 0.60
    source_ids: ["politico-2026-hegseth-anthropic-ultimatum"]
    operationalization: "Locate the senators’ statement and confirm its content and date."
    assumptions: []
    falsifiers:
      - "No such statement exists or it is materially mischaracterized."

  - id: "INST-2026-945"
    text: >-
      Politico reports a DoD official said xAI agreed to allow Grok in a classified setting and that OpenAI and
      Google are close to agreement, with other AI companies collaborating to enable “all lawful purposes” use.
    type: "[F]"
    domain: "INST"
    evidence_level: "E4"
    credence: 0.55
    source_ids: ["politico-2026-hegseth-anthropic-ultimatum"]
    operationalization: "Check for company statements or procurement announcements confirming classified/unclassified agreement status and deployment milestones."
    assumptions: []
    falsifiers:
      - "Companies or DoW contradict the claimed agreement status."

  - id: "INST-2026-946"
    text: >-
      Politico reports (citing Axios) that DoW asked defense contractors to assess their use of Anthropic’s model
      as a step toward designating Anthropic a supply-chain risk.
    type: "[F]"
    domain: "INST"
    evidence_level: "E4"
    credence: 0.60
    source_ids: ["politico-2026-hegseth-anthropic-ultimatum"]
    operationalization: "Obtain contractor confirmations or DoW documentation showing dependency assessment requests tied to a supply-chain-risk decision."
    assumptions: []
    falsifiers:
