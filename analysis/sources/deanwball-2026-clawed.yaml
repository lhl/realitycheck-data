    reliability: 0.55
    bias_notes: >-
      Politically charged polemic from a former Trump Administration staffer; strong priors about republican
      decline and executive thuggery. Contains some concrete factual assertions about U.S. DoD procurement and
      policy, but is not written as reported journalism and provides few citations.
